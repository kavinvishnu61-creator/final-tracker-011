<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        try {
          var mode = 'light';
          var param = new URLSearchParams(window.location.search).get('theme');
          if (param === 'dark' || param === 'light') {
            mode = param;
          } else {
            var raw = localStorage.getItem('dayly-settings');
            var saved = raw ? JSON.parse(raw)?.appearance : localStorage.getItem('dayly-appearance');
            if (saved === 'dark' || (saved === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
              mode = 'dark';
            }
          }
          document.documentElement.dataset.scene = mode;
          document.documentElement.style.colorScheme = mode;
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/png" href="./icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#071424" />
    <meta name="description" content="A calm habit tracker with nature photography and a simple daily check-in grid." />
    <title>Habit Tracker — Minimalist Sheet</title>
    <!-- DM Sans Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    <link rel="preload" as="image" href="./backgrounds/portfolio-mountain-07.webp" fetchpriority="high" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
